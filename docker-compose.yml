services:
  mongo:
    image: mongo:8.2.9
    container_name: curevo-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - curevo-mongo-data:/data/db

volumes:
  curevo-mongo-data:
