services:
  - type: web
    name: curevo
    env: node
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_PRODUCTION_WRITES
        value: "false"
      - key: NEXT_PUBLIC_ALLOW_INDEXING
        value: "false"
      - key: CLIENT_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: COOKIE_SAME_SITE
        value: "lax"
      - key: COOKIE_SECURE
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
