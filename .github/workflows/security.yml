name: Security and regression checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for credential assignments
        shell: bash
        run: |
          if git grep -nE '(SESSION_SECRET|JWT_SECRET|CLOUDINARY_API_SECRET|GOOGLE_CLIENT_SECRET|MONGO_URI).{0,4}[:=].{0,4}[^<[:space:]][^[:space:]]{7,}' -- ':!*.example' ':!docs/**'; then
            echo "Tracked credential assignment detected" >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:links
      - run: npm run lint
      - run: npm test
      - run: npm run build
